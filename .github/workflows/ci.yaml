# This workflow is the new CI pipeline built on top of @kie-tools/ci (./ci/).
# It runs IN PARALLEL with the legacy `ci_build.yml` while the new system is
# stabilized. Once proven, `ci_build.yml` + `.github/actions/{bootstrap,setup-ci-patterns}/`
# + `.github/supporting-files/ci/` can be deleted in a follow-up.

name: "CI :: Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: ${{ github.event.pull_request && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-push-main-{0}', github.sha) }}
  cancel-in-progress: true

jobs:
  run:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        partition: [0]
    runs-on: ${{ matrix.os }}
    env:
      TMPDIR: ${{ runner.temp }}
      BUILD_ENV__accessErrorsLogFileAbsolutePath: ${{ runner.temp }}/build-env-access-errors.log
    steps:
      - name: "SETUP :: Support longpaths (Windows)"
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: "SETUP :: Checkout @ GitHub default"
        uses: actions/checkout@v3

      - name: "SETUP :: Checkout @ Simulated squashed-merge if PR"
        id: checkout_pr
        uses: ./.github/actions/checkout-pr
        with:
          ref: ${{ github.base_ref }}

      - name: "SETUP :: Setup pnpm"
        uses: pnpm/action-setup@v3
        with:
          version: 10.29.2

      - name: "SETUP :: Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: "SETUP :: CI (install)"
        shell: bash
        run: npm ci --prefix ci

      - name: "SETUP :: CI (setup-patterns)"
        id: patterns
        shell: bash
        run: |
          npm exec --prefix ci -- bun ci/src/cli.ts setup-patterns --outputPath="${RUNNER_TEMP}/ci-patterns.json"

      - name: "SETUP :: CI (build-mode)"
        id: build_mode
        shell: bash
        run: |
          npm exec --prefix ci -- bun ci/src/cli.ts build-mode \
            --forceFull='${{ !github.event.pull_request }}' \
            --baseSha='${{ steps.checkout_pr.outputs.base_sha }}' \
            --headSha='${{ steps.checkout_pr.outputs.head_sha }}' \
            --graphJsonPath='./repo/graph.json' \
            --outputPath="${RUNNER_TEMP}/partitions.json" \
            --partitionIndex='${{ matrix.partition }}' \
            --tmpPartitionFilterPath="${RUNNER_TEMP}/partition-filter.txt"

      - name: "SETUP :: Environment"
        if: steps.build_mode.outputs.mode != 'none'
        uses: ./.github/actions/setup-env

      - name: "LOG :: Storage usage (before bootstrap)"
        if: steps.build_mode.outputs.mode != 'none'
        shell: bash
        run: df -h .

      - name: "CI :: Bootstrap :: Get `kie` cache key"
        if: steps.build_mode.outputs.mode != 'none'
        id: kie_cache_key
        env:
          DROOLS_AND_KOGITO__skip: true
          MAVEN_ARGS: "-B -Puse-maven-repo-local-tail"
          MAVEN_OPTS: "-Xmx3g"
        shell: bash
        run: |
          pnpm bootstrap -F @kie-tools-core/drools-and-kogito...
          keyOutput=$(cd packages/drools-and-kogito && pnpm run --silent print-cache-key)
          echo "KIE cache key: $keyOutput"
          echo "key=$keyOutput" >> "$GITHUB_OUTPUT"

      # Cache 'packages/drools-and-kogito/dist' using the git refs from Drools, OptaPlanner, Kogito Runtimes, and Kogito Apps as a unique key and refresh the cache on changes.
      # The maven-base profile 'use-maven-repo-local-tail', in packages/maven-base/pom.xml, uses this folder for maven artifacts.
      - name: "CI :: Bootstrap :: Cache `kie`"
        if: steps.build_mode.outputs.mode != 'none' && steps.kie_cache_key.outputs.key != ''
        id: kie_cache
        uses: actions/cache@v4
        with:
          path: packages/drools-and-kogito/dist
          key: ${{ runner.os }}-kie_cache-${{ steps.kie_cache_key.outputs.key }}

      - name: "CI :: Bootstrap"
        if: steps.build_mode.outputs.mode != 'none'
        shell: bash
        env:
          DROOLS_AND_KOGITO__skip: ${{ steps.kie_cache.outputs.cache-hit }}
          MAVEN_ARGS: "-B -Puse-maven-repo-local-tail"
          MAVEN_OPTS: "-Xmx3g"
        run: pnpm bootstrap ${{ steps.build_mode.outputs.bootstrapPnpmFilterString }}

      - name: "LOG :: Storage usage (after bootstrap)"
        if: steps.build_mode.outputs.mode != 'none'
        shell: bash
        run: df -h .

      - name: "SANITY CHECK :: Check hanging uncommitted files after bootstrapping"
        if: steps.build_mode.outputs.mode != 'none'
        shell: bash
        run: |
          git diff
          [ "0" == "$(git diff | wc -l | tr -d ' ')" ]

      - name: "CI :: FULL → Build"
        if: steps.build_mode.outputs.mode == 'full'
        shell: bash
        env:
          WEBPACK__minimize: "false"
          WEBPACK__tsLoaderTranspileOnly: "false"
          KIE_TOOLS_BUILD__runLinters: "true"
          KIE_TOOLS_BUILD__runTests: "true"
          KIE_TOOLS_BUILD__runEndToEndTests: ${{ runner.os == 'Linux' }}
          KIE_TOOLS_BUILD__containerizedEndToEndTests: ${{ runner.os == 'Linux' }}
          KIE_TOOLS_BUILD__buildContainerImages: ${{ runner.os == 'Linux' }}
          KIE_TOOLS_BUILD__buildExamples: "true"
          KIE_TOOLS_BUILD__ignoreTestFailures: ${{ !github.event.pull_request }}
          KIE_TOOLS_BUILD__ignoreEndToEndTestFailures: ${{ !github.event.pull_request }}
          PLAYWRIGHT_BASE__enableChromiumProject: "true"
          PLAYWRIGHT_BASE__enableGoogleChromeProject: "true"
          PLAYWRIGHT_BASE__enableWebkitProject: "true"
          PLAYWRIGHT_BASE__projectTimeout: "90000"
          PLAYWRIGHT_BASE__expectTimeout: "30000"
          PLAYWRIGHT_BASE__retries: "3"
          PLAYWRIGHT_BASE__workers: "2"
          DISPLAY: ":99.0"
          START_SERVER_AND_TEST_INSECURE: "true"
          NODE_OPTIONS: "--max_old_space_size=6144"
          MAVEN_ARGS: "-B -Puse-maven-repo-local-tail"
          MAVEN_OPTS: "-Xmx2g"
        run: >-
          eval "pnpm ${{ steps.build_mode.outputs.fullBuildPnpmFilterString }} --workspace-concurrency=1 build:prod"

      - name: "CI :: PARTIAL → Build upstream"
        if: steps.build_mode.outputs.mode == 'partial' && steps.build_mode.outputs.upstreamPnpmFilterString != ''
        shell: bash
        env:
          KIE_TOOLS_BUILD__buildContainerImages: ${{ runner.os == 'Linux' }}
          KIE_TOOLS_BUILD__buildExamples: "true"
          NODE_OPTIONS: "--max_old_space_size=6144"
          MAVEN_ARGS: "-B -Puse-maven-repo-local-tail"
          MAVEN_OPTS: "-Xmx2g"
        run: |
          eval "pnpm ${{ steps.build_mode.outputs.upstreamPnpmFilterString }} --if-present build:dev"

      - name: "CI :: PARTIAL → Build affected"
        if: steps.build_mode.outputs.mode == 'partial'
        shell: bash
        env:
          WEBPACK__minimize: "false"
          KIE_TOOLS_BUILD__runLinters: "true"
          KIE_TOOLS_BUILD__runTests: "true"
          KIE_TOOLS_BUILD__runEndToEndTests: ${{ runner.os == 'Linux' }}
          KIE_TOOLS_BUILD__buildContainerImages: ${{ runner.os == 'Linux' }}
          KIE_TOOLS_BUILD__buildExamples: "true"
          PLAYWRIGHT_BASE__enableChromiumProject: "true"
          PLAYWRIGHT_BASE__enableGoogleChromeProject: "true"
          PLAYWRIGHT_BASE__enableWebkitProject: "true"
          PLAYWRIGHT_BASE__projectTimeout: "90000"
          PLAYWRIGHT_BASE__expectTimeout: "30000"
          PLAYWRIGHT_BASE__retries: "3"
          PLAYWRIGHT_BASE__workers: "2"
          DISPLAY: ":99.0"
          START_SERVER_AND_TEST_INSECURE: "true"
          NODE_OPTIONS: "--max_old_space_size=6144"
          MAVEN_ARGS: "-B -Puse-maven-repo-local-tail"
          MAVEN_OPTS: "-Xmx2g"
        run: |
          eval "pnpm ${{ steps.build_mode.outputs.affectedPnpmFilterString }} --if-present --workspace-concurrency=1 build:prod"

      - name: "CI :: Check tests result"
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        shell: bash
        run: |
          npm exec --prefix ci -- bun ci/src/cli.ts check-junit-reports --patternsJsonPath="${RUNNER_TEMP}/ci-patterns.json"

      - name: "SANITY CHECK :: Check build-env access errors log"
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        shell: bash
        run: |
          touch "$BUILD_ENV__accessErrorsLogFileAbsolutePath"
          cat "$BUILD_ENV__accessErrorsLogFileAbsolutePath"
          [ "0" == "$(cat "$BUILD_ENV__accessErrorsLogFileAbsolutePath" | wc -l | tr -d ' ')" ]

      - name: "SANITY CHECK :: Check hanging uncommitted files after building"
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        shell: bash
        run: |
          git diff
          [ "0" == "$(git diff | wc -l | tr -d ' ')" ]

      - name: "CI :: Summary"
        if: always() && !cancelled()
        shell: bash
        run: |
          npm exec --prefix ci -- bun ci/src/cli.ts summary \
            --partitionsJsonPath="${RUNNER_TEMP}/partitions.json" \
            --partitionIndex='${{ matrix.partition }}' \
            --os='${{ runner.os }}' \
            --triggeredBy='${{ github.event.pull_request && 'pull-request' || 'push-main' }}' \
            --outputPath="${RUNNER_TEMP}/build-summary.md"

      - name: "LOG :: Upload reports and artifacts"
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        shell: bash
        env:
          PARTITION_INDEX: ${{ matrix.partition }}
          CI_PATTERNS_JSON: ${{ runner.temp }}/ci-patterns.json
        run: |
          # Parse patterns from JSON
          TESTS_REPORTS_PATTERNS=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.CI_PATTERNS_JSON, 'utf8')).testsReports.join('\n'))")
          END_TO_END_TESTS_REPORTS_PATTERNS=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.CI_PATTERNS_JSON, 'utf8')).endToEndTestsReports.join('\n'))")
          END_TO_END_TESTS_ARTIFACTS_PATTERNS=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.CI_PATTERNS_JSON, 'utf8')).endToEndTestsArtifacts.join('\n'))")
          BUILD_ARTIFACTS_PATTERNS=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.env.CI_PATTERNS_JSON, 'utf8')).buildArtifacts.join('\n'))")

          # Zip artifacts and reports
          output_empty_zip () { echo UEsFBgAAAAAAAAAAAAAAAAAAAAAAAA== | base64 -d; }
          zip -rq $RUNNER_TEMP/tests-reports.zip $TESTS_REPORTS_PATTERNS || output_empty_zip > $RUNNER_TEMP/tests-reports.zip
          zip -rq $RUNNER_TEMP/end-to-end-tests-reports.zip $END_TO_END_TESTS_REPORTS_PATTERNS || output_empty_zip > $RUNNER_TEMP/end-to-end-tests-reports.zip
          zip -rq $RUNNER_TEMP/end-to-end-tests-artifacts.zip $END_TO_END_TESTS_ARTIFACTS_PATTERNS || output_empty_zip > $RUNNER_TEMP/end-to-end-tests-artifacts.zip
          zip -rq $RUNNER_TEMP/build-artifacts.zip $BUILD_ARTIFACTS_PATTERNS || output_empty_zip > $RUNNER_TEMP/build-artifacts.zip
          ls -la $RUNNER_TEMP

      - name: "LOG :: Upload tests reports"
        uses: actions/upload-artifact@v4
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        with:
          name: ${{ runner.os }}_${{ matrix.partition }}__tests-reports
          path: |
            ${{ runner.temp }}/tests-reports.zip

      - name: "LOG :: Upload end-to-end tests reports"
        uses: actions/upload-artifact@v4
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        with:
          name: ${{ runner.os }}_${{ matrix.partition }}__end-to-end-tests-reports
          path: |
            ${{ runner.temp }}/end-to-end-tests-reports.zip

      - name: "LOG :: Upload end-to-end tests artifacts"
        uses: actions/upload-artifact@v4
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        with:
          name: ${{ runner.os }}_${{ matrix.partition }}__end-to-end-tests-artifacts
          path: |
            ${{ runner.temp }}/end-to-end-tests-artifacts.zip

      - name: "LOG :: Upload build artifacts"
        uses: actions/upload-artifact@v4
        if: always() && !cancelled() && steps.build_mode.outputs.mode != 'none'
        with:
          name: ${{ runner.os }}_${{ matrix.partition }}__build-artifacts
          path: |
            ${{ runner.temp }}/build-artifacts.zip

      - name: "LOG :: Storage usage (after build)"
        if: always() && !cancelled()
        shell: bash
        run: |
          df -h .
